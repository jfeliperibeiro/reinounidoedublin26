  <h1 style="text-align:center;">✈️ Detalhes dos Deslocamentos</h1>

  <div class="deslocamentos-container" id="displacement-details">
    <!-- Os detalhes dos deslocamentos serão gerados dinamicamente aqui -->
  </div>

  <script>
    // Dados da aba "deslocamento" (excluindo a linha de cabeçalho inicial)
    const displacementRecords = [
      ["2024-03-27 00:00:00","São Paulo  → London","Avião"],
      ["2026-04-01 00:00:00","Londres → Brighton","Trem"],
      ["2026-04-02 00:00:00","Brighton → Seaford → Brighton","Trem"],
      ["2026-04-03 00:00:00","Brighton → Portsmouth","Trem"],
      ["2026-04-04 00:00:00","Portsmouth → Southampton","Trem"],
      ["2026-04-05 00:00:00","Southampton → Salisbury","Trem"],
      ["2026-04-06 00:00:00","Salisbury → Stonehenge  → Salisbury","Tour"],
      ["2026-04-07 00:00:00","Salisbury → Bath","Trem"],
      ["2026-04-09 00:00:00","Bath → Bristol","Trem"],
      ["2026-04-10 00:00:00","Bristol → Cardiff","Trem"],
      ["2026-04-11 00:00:00","Cardiff → Dublin","Avião"],
      ["2026-04-14 00:00:00","Dublin → Liverpool","Avião"],
      ["2026-04-16 00:00:00","Liverpool → Manchester","Trem"],
      ["2026-04-20 00:00:00","Manchester → Windermere","Trem"],
      ["2026-04-22 00:00:00","Windermere → Glasgow","Trem"],
      ["2026-04-23 00:00:00","Glasgow → Edimburgo","Trem"],
      ["2026-04-24 00:00:00","Edimburgo → Highlands + Lago Ness  → Edimburgo","Tour"],
      ["2026-04-25 00:00:00","Edimburgo → Stirling   → Edimburgo","Trem"],
      ["2026-04-26 00:00:00","Edimburgo → Newcastle","Trem"],
      ["2026-04-28 00:00:00","Newcastle → York","Trem"],
      ["2026-04-30 00:00:00","York → London","Trem"],
      ["2026-05-02 00:00:00","Londres → São Paulo","Avião"]
    ];

    // Função para estimar tempo de viagem e sugerir horário de saída
    function getTravelEstimates(originDestination, modality) {
        let travelTime = "N/A";
        let suggestedDeparture = "N/A";

        if (modality.includes("Avião")) {
            if (originDestination.includes("São Paulo") && originDestination.includes("London")) {
                travelTime = "Aproximadamente 12-15 horas (incluindo tempo de voo e aeroporto)";
                suggestedDeparture = "Noite anterior (para chegada cedo em Londres)"; 
            } else if (originDestination.includes("Londres") && originDestination.includes("São Paulo")) {
                travelTime = "Aproximadamente 12-15 horas (incluindo tempo de voo e aeroporto)";
                suggestedDeparture = "Manhã/Início da tarde (09:00-14:00)"; 
            } else if (originDestination.includes("Cardiff → Dublin") ||
                       originDestination.includes("Dublin → Liverpool")) {
                travelTime = "Aproximadamente 3-4 horas (incluindo tempo de voo e aeroporto)";
                suggestedDeparture = "07:00 - 09:00";
            } else {
                travelTime = "Variável (voo + aeroporto)";
                suggestedDeparture = "Manhã (07:00-10:00)";
            }
        } else if (modality.includes("Trem")) {
            if (originDestination.includes("Brighton → Seaford → Brighton")) {
                 travelTime = "Cerca de 1-1.5 horas por trecho";
                 suggestedDeparture = "09:00 - 10:00";
            } else { // Para a maioria dos trechos de trem no RU
                travelTime = "Aproximadamente 1-3 horas"; 
                suggestedDeparture = "08:00 - 09:00";
            }
        } else if (modality.includes("Tour")) {
            travelTime = "Dia inteiro (8-10 horas) ou meio período (4-5 horas)";
            suggestedDeparture = "08:00 - 09:00 (para tours de dia inteiro)";
        }

        return { travelTime, suggestedDeparture };
    }

    const displacementContainer = document.getElementById('displacement-details');
    let htmlContent = '';

    displacementRecords.forEach(record => {
        const dateRaw = record[0];
        const originDestination = record[1];
        const modality = record[2];

        const date = new Date(dateRaw);
        const formattedDate = date.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });

        const { travelTime, suggestedDeparture } = getTravelEstimates(originDestination, modality);

        htmlContent += `
            <div class="deslocamento-item">
                <h3>📅 ${formattedDate} - ${originDestination}</h3>
                <p><strong>Modalidade:</strong> ${modality}</p>
                <p><strong>Tempo estimado de viagem:</strong> ${travelTime} <small>(não inclui tempo de deslocamento local para aeroportos/estações)</small></p>
                <p><strong>Sugestão de horário de saída:</strong> ${suggestedDeparture}</p>
            </div>
        `;
    });

    // Adiciona o disclaimer no final
    htmlContent += `<p class="disclaimer">
      <em>* Os tempos estimados de viagem e sugestões de horário de saída são baseados em médias e podem variar.
      Recomenda-se verificar os horários de voos/trens e planejar com antecedência.
      O tempo de deslocamento local (por exemplo, do seu alojamento até a estação ou aeroporto) não está incluído nestas estimativas.
      Note que a data de saída para Londres (${new Date("2024-03-27 00:00:00").toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' })})
      é anterior ao restante do roteiro (2026), o que pode ser uma inconsistência nos dados originais da sua planilha.
      </em>
    </p>`;

    displacementContainer.innerHTML = htmlContent;
  </script>

</body>
